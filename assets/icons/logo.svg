<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 64 64"
    role="img"
    aria-labelledby="lunera-logo-title"
>
    <title id="lunera-logo-title">
        Lunera planet logo
    </title>

    <defs>
        <linearGradient
            id="planet-body"
            x1="18"
            y1="11"
            x2="47"
            y2="55"
            gradientUnits="userSpaceOnUse"
        >
            <stop
                offset="0"
                stop-color="#F4E4FF"
            />
            <stop
                offset="1"
                stop-color="#EFDDF8"
            />
        </linearGradient>

        <linearGradient
            id="planet-ring"
            x1="7"
            y1="44"
            x2="58"
            y2="20"
            gradientUnits="userSpaceOnUse"
        >
            <stop
                offset="0"
                stop-color="#A15CFF"
            />
            <stop
                offset="1"
                stop-color="#B979F8"
            />
        </linearGradient>
    </defs>

    <ellipse
        cx="32"
        cy="32"
        rx="26"
        ry="10"
        fill="none"
        stroke="url(#planet-ring)"
        stroke-width="8"
        transform="rotate(-18 32 32)"
    />

    <circle
        cx="32"
        cy="32"
        r="23"
        fill="url(#planet-body)"
    />

    <path
        d="M10 38C22 45 43 42 54 29"
        fill="none"
        stroke="url(#planet-ring)"
        stroke-width="8"
        stroke-linecap="round"
    />
</svg>
