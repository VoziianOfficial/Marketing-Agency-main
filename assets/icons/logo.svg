<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 64 64"
    role="img"
    aria-labelledby="lunera-logo-title"
>
    <title id="lunera-logo-title">
        Lunera logo
    </title>

    <!-- subtle depth layer -->
    <path
        d="M19 12V39C19 48 24.5 53 34 53H50"
        fill="none"
        stroke="#17151F"
        stroke-width="11"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.14"
        transform="translate(2 2)"
    />

    <!-- main L mark -->
    <path
        d="M19 12V39C19 48 24.5 53 34 53H50"
        fill="none"
        stroke="#8B3DF5"
        stroke-width="11"
        stroke-linecap="round"
        stroke-linejoin="round"
    />

    <!-- upper accent -->
    <circle
        cx="19"
        cy="12"
        r="5.5"
        fill="#42C7F4"
        stroke="#FFFFFF"
        stroke-width="2"
    />

    <!-- end accent -->
    <circle
        cx="50"
        cy="53"
        r="5.5"
        fill="#FF682B"
        stroke="#FFFFFF"
        stroke-width="2"
    />

    <!-- inner designer detail -->
    <path
        d="M32 34C36.5 29.5 41 27.5 47 27.5"
        fill="none"
        stroke="#17151F"
        stroke-width="4"
        stroke-linecap="round"
    />

    <circle
        cx="48"
        cy="27.5"
        r="2.8"
        fill="#17151F"
    />
</svg>
